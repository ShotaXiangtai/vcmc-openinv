name: vcmc-openinv
version: '${project.version}'
main: net.vcmc.openinv.OpenInvPlugin
api-version: '26.1'
folia-supported: true
description: プレイヤーインベントリ・エンダーチェストの閲覧/編集（オフライン対応 + 死亡前インベントリ復元）
authors:
  - vcmc

commands:
  openinv:
    description: プレイヤーのインベントリを開く（オフライン対応）
    usage: /openinv <プレイヤー名>
    permission: openinv.openinv
    aliases: [oi]
  openender:
    description: プレイヤーのエンダーチェストを開く（オフライン対応）
    usage: /openender <プレイヤー名>
    permission: openinv.openender
    aliases: [oe]
  restoreinv:
    description: プレイヤーの死亡前インベントリを復元する
    usage: /restoreinv <プレイヤー名> [インデックス] [confirm]
    permission: openinv.restoreinv
    aliases: [ri]

permissions:
  openinv.openinv:
    description: インベントリを開く権限
    default: op
  openinv.openender:
    description: エンダーチェストを開く権限
    default: op
  openinv.restoreinv:
    description: 死亡前インベントリを復元する権限
    default: op
  openinv.*:
    description: 全 OpenInv 権限
    default: op
    children:
      openinv.openinv: true
      openinv.openender: true
      openinv.restoreinv: true
